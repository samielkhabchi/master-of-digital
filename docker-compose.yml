services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - catalog:/data
    expose:
      - "3000"

  # HTTPS for masterofdigital.com (certificates are issued automatically).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  catalog:
  caddy_data:
